<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진입 진단 · sci-arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#FAFBFD; --ink:#172033; --ink-soft:#4A5670; --grid:#DCE4F0; --grid-strong:#B9C7DD;
  --blue:#1D3FA8; --blue-soft:#E7ECFA; --marker:#FFD84D; --marker-soft:#FFF4C2;
  --ok:#1E7A50; --ok-soft:#E3F3EA; --bad:#B83434; --bad-soft:#FBE7E7;
  --radius-s:6px; --radius-m:10px;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;word-break:keep-all;overflow-wrap:anywhere;background:var(--paper);color:var(--ink);font-family:var(--font);}
body{min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--grid);padding:12px 16px}
.top-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px}
.close{border:none;background:none;font-size:22px;line-height:1;padding:6px 8px;cursor:pointer;color:var(--ink-soft);border-radius:var(--radius-s)}
.close:hover{background:var(--blue-soft)}
.bar{flex:1;height:10px;background:var(--grid);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s ease}
.where{font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
main{flex:1;width:100%;max-width:680px;margin:0 auto;padding:28px 20px 140px}
.stage{font-size:13px;color:var(--ink-soft);margin:0 0 6px}
h1{font-size:26px;line-height:1.35;margin:0 0 18px;font-weight:700;letter-spacing:-.01em}
.body p{font-size:18px;line-height:1.75;margin:0 0 14px}
.prompt{font-size:20px;line-height:1.7;margin:0 0 22px;font-weight:500}
.figure{margin:22px 0;padding:16px;border:1px solid var(--grid);border-radius:var(--radius-m);background:#fff;overflow-x:auto}
.figure svg{display:block;max-width:100%;height:auto;margin:0 auto}
input.ans{border:2px solid var(--grid-strong);border-radius:var(--radius-s);padding:10px 12px;font-size:20px;background:#fff;width:100%;max-width:260px}
input.blank{border:none;border-bottom:3px solid var(--blue);background:var(--marker-soft);font-size:20px;width:5.2em;padding:2px 6px;margin:0 3px;text-align:center;border-radius:4px 4px 0 0}
input.ans:focus,input.blank:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea{width:100%;min-height:140px;border:2px solid var(--grid-strong);border-radius:var(--radius-s);padding:12px;font-size:17px;line-height:1.6;background:#fff;resize:vertical}
.order{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.order li{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--grid-strong);border-radius:var(--radius-s);padding:10px 12px;font-size:18px}
.order li .n{color:var(--ink-soft);font-size:14px;width:1.4em}
.order li .t{flex:1}
.order button{border:1px solid var(--grid-strong);background:var(--paper);border-radius:var(--radius-s);width:36px;height:36px;cursor:pointer;font-size:16px}
.order button:disabled{opacity:.3;cursor:default}
.pad{touch-action:manipulation;cursor:crosshair}
svg.pad:focus{outline:none}
svg.pad:focus-visible{outline:3px solid var(--blue);outline-offset:4px;border-radius:4px}
.readout{font-size:15px;color:var(--ink-soft);margin-top:8px;text-align:center}
.symbols{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 20px}
.symbols button{min-width:44px;height:40px;border:1px solid var(--grid-strong);background:#fff;border-radius:var(--radius-s);font-size:19px;cursor:pointer}
.symbols button:hover{background:var(--blue-soft)}
.conceptbox{margin-top:18px;padding:12px 14px;background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:0 var(--radius-s) var(--radius-s) 0;font-size:16px;line-height:1.6}
.conceptbox b{display:block;margin-bottom:4px}
.fb-text{max-height:46vh;overflow-y:auto}
.answerline{font-weight:700;margin:4px 0 2px}
.solution{margin-top:6px}
.solution ol{margin:4px 0 0;padding-left:1.3em}
.solution li{margin:2px 0}
.ex-problem{font-size:19px;line-height:1.7;margin:0 0 18px;padding:14px 16px;background:#fff;border:1px solid var(--grid);border-radius:var(--radius-m)}
.ex-steps{margin:0;padding-left:1.4em;font-size:18px;line-height:1.75}
.ex-steps li{margin:0 0 8px}
.ex-steps li[hidden]{display:none}
.ex-answer{margin-top:14px;font-weight:700;font-size:18px;color:var(--ok)}
.hintbox{margin-top:18px;padding:12px 14px;background:var(--marker-soft);border-left:4px solid var(--marker);border-radius:0 var(--radius-s) var(--radius-s) 0;font-size:16px;line-height:1.6}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:6;border-top:1px solid var(--grid);background:var(--paper);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.feedback.ok{background:var(--ok-soft);border-top-color:#BFE3CF}
.feedback.bad{background:var(--bad-soft);border-top-color:#F0C4C4}
.fb-inner{max-width:680px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.fb-text{flex:1 1 280px;font-size:16px;line-height:1.6}
.fb-text strong{display:block;font-size:18px;margin-bottom:2px}
.feedback.ok strong{color:var(--ok)} .feedback.bad strong{color:var(--bad)}
.btn{border:none;border-radius:var(--radius-m);padding:13px 22px;font-size:17px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;min-width:120px}
.btn:disabled{background:var(--grid-strong);cursor:default}
.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn.link{white-space:nowrap;flex:0 0 auto !important;background:none;color:var(--ink-soft);font-weight:500;min-width:0;padding:13px 8px;text-decoration:underline}
.done{text-align:left}
.score{font-size:64px;font-weight:700;line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.score small{font-size:24px;color:var(--ink-soft);font-weight:500}
.error{padding:18px;border:2px solid var(--bad);border-radius:var(--radius-m);background:var(--bad-soft)}
@media (max-width:520px){.where{max-width:30%}h1{font-size:22px}.prompt{font-size:18px}.body p{font-size:17px}.btn{flex:1}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ---------- 진단 전용 ---------- */
.lede{font-size:18px;line-height:1.75;color:var(--ink-soft);margin:0 0 22px}
.facts{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:8px}
.facts li{font-size:16px;line-height:1.6;padding-left:22px;position:relative}
.facts li::before{content:"";position:absolute;left:4px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--blue)}
fieldset{border:none;margin:0;padding:0}
legend{font-size:18px;font-weight:700;margin:0 0 12px}
.choice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:2px solid var(--grid-strong);border-radius:var(--radius-m);background:#fff;margin-bottom:10px;cursor:pointer}
.choice:hover{border-color:var(--blue)}
.choice input{margin-top:4px;accent-color:var(--blue);width:18px;height:18px;flex:0 0 auto}
.choice b{display:block;font-size:17px}
.choice span{font-size:15px;color:var(--ink-soft);line-height:1.5}
.choice:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.course-tag{display:inline-block;font-size:13px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:3px 10px;margin:0 0 10px}
.result-hero{border:2px solid var(--ink);border-radius:var(--radius-m);padding:20px;background:#fff;margin:0 0 26px}
.result-hero .kicker{font-size:14px;color:var(--ink-soft);margin:0 0 4px}
.result-hero h1{margin:0 0 10px}
.result-hero p{margin:0 0 16px;font-size:16px;line-height:1.6;color:var(--ink-soft)}
.cta-row{display:flex;flex-wrap:wrap;gap:10px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
h2.sec{font-size:19px;margin:30px 0 12px}
.clist{list-style:none;margin:0;padding:0;border-top:1px solid var(--grid)}
.clist li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--grid);font-size:16px}
.clist .sub{display:block;font-size:14px;color:var(--ink-soft);margin-top:2px}
.chip{font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip.pass{background:var(--ok-soft);color:var(--ok)}
.chip.assumed{background:var(--ok-soft);color:var(--ok);opacity:.8}
.chip.start{background:var(--marker);color:var(--ink)}
.chip.later{background:var(--grid);color:var(--ink-soft)}
.chip.fail{background:var(--bad-soft);color:var(--bad)}
.chip.untested{background:transparent;color:var(--ink-soft);border:1px solid var(--grid-strong)}
.weak a{color:var(--blue)}
details.miss{border:1px solid var(--grid);border-radius:var(--radius-m);background:#fff;margin:0 0 10px}
details.miss summary{cursor:pointer;padding:12px 14px;font-size:16px;line-height:1.5}
details.miss summary small{color:var(--ink-soft)}
details.miss .inner{padding:0 14px 14px;font-size:16px;line-height:1.6}
.elect{display:grid;gap:10px;margin-top:6px}
.elect .card{border:1px solid var(--grid);border-radius:var(--radius-m);background:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.elect .card p{margin:0;font-size:15px;color:var(--ink-soft)}
.note{font-size:14px;color:var(--ink-soft);line-height:1.6}
.track{border:1px solid var(--grid);border-radius:var(--radius-m);background:#fff;padding:14px 16px;margin:0 0 10px}
.track h3{margin:0 0 8px;font-size:17px}
.track .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:16px;border-top:1px solid var(--grid)}
.track .row:first-of-type{border-top:none}
.track .row .sub{display:block;font-size:14px;color:var(--ink-soft)}
.track .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.subj{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 6px}
.subj .choice{margin:0}
.err{color:var(--bad);font-size:15px;margin:8px 0 0}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <button class="close" id="close" aria-label="진단 나가기">✕</button>
  <div class="bar" role="progressbar" aria-label="진단 진행률" aria-valuemin="0" aria-valuemax="100"><i id="barFill"></i></div>
  <span class="where" id="where">진입 진단</span>
</div></header>
<main id="main" aria-live="polite"></main>
<div class="feedback" id="fb" hidden><div class="fb-inner">
  <div class="fb-text" id="fbText"></div>
  <button class="btn ghost" id="skipBtn">모르겠어요</button>
  <button class="btn" id="mainBtn">다음</button>
</div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);

/* ---------- 채점 도구 ---------- */
/* 과학용: 첨자·위첨자를 일반 숫자로 통일(H₂O = H2O, Mg²⁺ = Mg2+ = Mg^2+). 화학식 구분을 위해 대소문자는 유지 */
const SUP = {"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁺":"+","⁻":"-",
             "₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7","₈":"8","₉":"9"};
function norm(s){
  return String(s).trim().replace(/\s+/g, "").replace(/[−–—]/g, "-")
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻₀₁₂₃₄₅₆₇₈₉]/g, c => SUP[c]).replace(/\^/g, "").replace(/×/g, "*")
    .replace(/<=/g, "≤").replace(/>=/g, "≥").replace(/!=/g, "≠").replace(/°/g, "");
}
function frac(s){
  s = norm(s).replace(/^\+/, "");
  let m;
  if ((m = s.match(/^(-?\d+)\/(-?\d+)$/))) { const d = +m[2]; return d === 0 ? null : [+m[1], d]; }
  if ((m = s.match(/^(-?)(\d*)\.(\d+)$/))) { const den = 10 ** m[3].length; const n = +(m[2] || 0) * den + +m[3]; return [m[1] ? -n : n, den]; }
  if (/^-?\d+$/.test(s)) return [+s, 1];
  return null;
}
const fracEq = (a, b) => a && b && a[0] * b[1] === b[0] * a[1];
const fracVal = f => f[0] / f[1];

/* ---------- SVG 도구 ---------- */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function txt(parent, x, y, s, attrs = {}){ const t = el("text", Object.assign({x, y, "font-size":14, fill:"#4A5670", "text-anchor":"middle", "font-family":"IBM Plex Sans KR, sans-serif"}, attrs), parent); t.textContent = s; return t; }
const fmt = v => { const r = Math.round(v * 1000) / 1000; return (r < 0 ? "−" : "") + Math.abs(r); };
const fmtPi = v => { const r = v / Math.PI; if (Math.abs(r) < 1e-9) return "0";
  for (let d = 1; d <= 6; d++){ const n = Math.round(r * d); if (Math.abs(r - n / d) < 1e-6){
    const sg = n < 0 ? "−" : "", an = Math.abs(n); return sg + (an === 1 ? "" : an) + "π" + (d === 1 ? "" : "/" + d); } }
  return fmt(v); };

function numberLine(cfg, interactive, onChange){
  const W = 600, H = 96, pad = 30, {min, max, step} = cfg;
  const X = v => pad + (v - min) / (max - min) * (W - 2 * pad);
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, width:W, role: interactive ? "slider" : "img",
    "aria-label": interactive ? "수직선: 방향키나 클릭으로 점을 옮기세요" : "수직선"});
  el("line", {x1:pad - 12, x2:W - pad + 12, y1:48, y2:48, stroke:"#172033", "stroke-width":2}, svg);
  const n = Math.round((max - min) / step);
  const labelEvery = n > 24 ? Math.round(1 / step) : (step < 1 ? Math.round(1 / step) : 1);
  for (let i = 0; i <= n; i++){
    const v = min + i * step, major = i % labelEvery === 0;
    el("line", {x1:X(v), x2:X(v), y1:major ? 40 : 44, y2:major ? 56 : 52, stroke:"#172033", "stroke-width":major ? 2 : 1}, svg);
    if (major) txt(svg, X(v), 78, fmt(v), {fill: Math.abs(v) < 1e-9 ? "#172033" : "#4A5670"});
  }
  if (!interactive) return svg;
  svg.classList.add("pad"); svg.tabIndex = 0;
  const dot = el("circle", {r:9, cy:48, fill:"#1D3FA8", stroke:"#fff", "stroke-width":3, visibility:"hidden"}, svg);
  let val = null;
  const set = v => { v = Math.min(max, Math.max(min, Math.round((v - min) / step) * step + min)); v = Math.round(v * 1e6) / 1e6;
    val = v; dot.setAttribute("cx", X(v)); dot.setAttribute("visibility", "visible"); svg.setAttribute("aria-valuenow", v); onChange(v, fmt(v)); };
  svg.addEventListener("pointerdown", e => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width * W; set(min + (px - pad) / (W - 2 * pad) * (max - min)); });
  svg.addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowLeft"){ e.preventDefault(); set((val ?? (min + max) / 2) + (e.key === "ArrowRight" ? step : -step)); } });
  svg.lock = () => { svg.style.pointerEvents = "none"; };
  return svg;
}

function curveFn(c){
  return {
      poly: t => c.coef.reduce((acc, co, k) => acc + co * t ** k, 0),
      rational: t => Math.abs(t - c.p) < 1e-9 ? NaN : c.k / (t - c.p) + c.q,
      sqrt: t => c.b * (t - c.p) < 0 ? NaN : c.a * Math.sqrt(c.b * (t - c.p)) + c.q,
      abs: t => c.a * Math.abs(t - c.p) + c.q,
      exp: t => c.a * Math.pow(c.b, t - c.p) + c.q,
      log: t => t - c.p <= 0 ? NaN : c.a * Math.log(t - c.p) / Math.log(c.b) + c.q,
      trig: t => { const u = c.b * (t - c.p); const v = c.fn === "sin" ? Math.sin(u) : c.fn === "cos" ? Math.cos(u) : Math.tan(u);
                   return c.fn === "tan" && Math.abs(Math.cos(u)) < 1e-3 ? NaN : c.a * v + c.q; },
      normal: t => (c.scale ?? 1) * Math.exp(-((t - c.m) ** 2) / (2 * c.s * c.s)) / (c.s * Math.sqrt(2 * Math.PI))
  }[c.kind];
}

function drawCurves(svg, cfg, X, Y, pad, S){
  const curves = cfg.curves || []; if (!curves.length) return;
  const {xmin, xmax, ymin, ymax} = cfg, id = "clip" + Math.random().toString(36).slice(2, 8);
  const defs = el("defs", {}, svg), cp = el("clipPath", {id}, defs);
  el("rect", {x:X(xmin), y:Y(ymax), width:X(xmax) - X(xmin), height:Y(ymin) - Y(ymax)}, cp);
  const g = el("g", {"clip-path":`url(#${id})`}, svg);
  const colors = ["#1D3FA8", "#C2410C", "#1E7A50"];
  let ci = 0;
  [...curves].sort((p, q) => (q.kind === "shade") - (p.kind === "shade")).forEach(c => {
    const col = c.color || colors[ci++ % colors.length];
    if (c.kind === "circle"){ el("circle", {cx:X(c.cx), cy:Y(c.cy), r:Math.abs(X(c.cx + c.r) - X(c.cx)), fill:"none", stroke:col, "stroke-width":2.5}, g); return; }
    if (c.kind === "ellipse" || c.kind === "hyperbola" || c.kind === "parab_x"){
      const cx = c.cx || 0, cy = c.cy || 0, branches = [];
      if (c.kind === "ellipse"){ const pts = []; for (let i = 0; i <= 360; i++){ const t = i / 360 * 2 * Math.PI; pts.push([cx + c.a * Math.cos(t), cy + c.b * Math.sin(t)]); } branches.push(pts); }
      if (c.kind === "hyperbola"){ const U = 4; [1, -1].forEach(sg => { const pts = [];
        for (let i = 0; i <= 400; i++){ const u = -U + 2 * U * i / 400; const ch = Math.cosh(u), sh = Math.sinh(u);
          pts.push(c.axis === "y" ? [cx + c.b * sh, cy + sg * c.a * ch] : [cx + sg * c.a * ch, cy + c.b * sh]); } branches.push(pts); }); }
      if (c.kind === "parab_x"){ const pts = [], sp = (ymax - ymin) * 1.5;
        for (let i = 0; i <= 400; i++){ const v = -sp + 2 * sp * i / 400; pts.push([cx + v * v / (4 * c.p), cy + v]); } branches.push(pts); }
      branches.forEach(pts => el("path", {d: pts.map((q, i) => (i ? "L" : "M") + X(q[0]).toFixed(1) + " " + Y(q[1]).toFixed(1)).join(" "), fill:"none", stroke:col, "stroke-width":2.5}, g));
      return;
    }
    if (c.kind === "arrow"){
      const x1 = X(c.x1), y1 = Y(c.y1), x2 = X(c.x2), y2 = Y(c.y2), ang = Math.atan2(y2 - y1, x2 - x1), hl = 12;
      el("line", {x1, y1, x2, y2, stroke:col, "stroke-width":2.5}, g);
      el("path", {d:`M${x2} ${y2} L${x2 - hl * Math.cos(ang - 0.4)} ${y2 - hl * Math.sin(ang - 0.4)} L${x2 - hl * Math.cos(ang + 0.4)} ${y2 - hl * Math.sin(ang + 0.4)} Z`, fill:col}, g);
      if (c.label) txt(g, (x1 + x2) / 2 + 10, (y1 + y2) / 2 - 8, c.label, {fill:col, "font-size":15, "text-anchor":"start"});
      return;
    }
    if (c.kind === "vline"){ el("line", {x1:X(c.x), x2:X(c.x), y1:Y(ymin), y2:Y(ymax), stroke:"#4A5670", "stroke-dasharray":"5 5", "stroke-width":1.5}, g); return; }
    if (c.kind === "hline"){ el("line", {x1:X(xmin), x2:X(xmax), y1:Y(c.y), y2:Y(c.y), stroke:"#4A5670", "stroke-dasharray":"5 5", "stroke-width":1.5}, g); return; }
    if (c.kind === "shade"){
      const f1 = curveFn(c.curve), f2 = c.curve2 ? curveFn(c.curve2) : (() => 0);
      if (!f1 || !f2) return;
      const lo2 = Math.max(xmin, c.from), hi2 = Math.min(xmax, c.to), M = 300; let d = "";
      for (let i = 0; i <= M; i++){ const t = lo2 + (hi2 - lo2) * i / M; d += (i ? " L" : "M") + `${X(t).toFixed(1)} ${Y(Math.max(ymin, Math.min(ymax, f1(t)))).toFixed(1)}`; }
      for (let i = M; i >= 0; i--){ const t = lo2 + (hi2 - lo2) * i / M; d += ` L${X(t).toFixed(1)} ${Y(Math.max(ymin, Math.min(ymax, f2(t)))).toFixed(1)}`; }
      el("path", {d: d + " Z", fill:"rgba(29,63,168,0.18)", stroke:"none"}, g); return;
    }
    const f = curveFn(c);
    if (!f) return;
    let lo = Math.max(xmin, c.from ?? -Infinity), hi = Math.min(xmax, c.to ?? Infinity);
    if (lo >= hi) return;
    if (c.kind === "sqrt"){ if (c.b > 0) lo = Math.max(lo, c.p); else hi = Math.min(hi, c.p); if (lo >= hi) return; }
    if (c.kind === "log"){ lo = Math.max(lo, c.p + 1e-4); if (lo >= hi) return; }
    const N = 900, span = ymax - ymin; let d = "", prev = null;
    for (let i = 0; i <= N; i++){
      const t = lo + (hi - lo) * i / N, v = f(t);
      if (!Number.isFinite(v) || v < ymin - span || v > ymax + span){ prev = null; continue; }
      const jump = prev !== null && Math.abs(v - prev) > span;
      d += (prev === null || jump ? " M" : " L") + `${X(t).toFixed(1)} ${Y(v).toFixed(1)}`; prev = v;
    }
    el("path", {d, fill:"none", stroke:col, "stroke-width":2.5, "stroke-linejoin":"round"}, g);
  });
}

function coordPlane(cfg, onChange, interactive = true){
  const {xmin, xmax, ymin, ymax, xstep = 1, ystep = 1} = cfg, S = 420, pad = 34;
  const X = v => pad + (v - xmin) / (xmax - xmin) * (S - 2 * pad);
  const Y = v => S - pad - (v - ymin) / (ymax - ymin) * (S - 2 * pad);
  const svg = el("svg", interactive ? {viewBox:`0 0 ${S} ${S}`, width:S, role:"application", "aria-label":"좌표평면: 클릭하거나 방향키로 점을 옮기세요"}
                                    : {viewBox:`0 0 ${S} ${S}`, width:S, role:"img", "aria-label":"그래프"});
  if (interactive){ svg.classList.add("pad"); svg.tabIndex = 0; }
  const nx = Math.round((xmax - xmin) / xstep), ny = Math.round((ymax - ymin) / ystep);
  for (let i = 0; i <= nx; i++){ const v = xmin + i * xstep; el("line", {x1:X(v), x2:X(v), y1:Y(ymin), y2:Y(ymax), stroke:"#DCE4F0"}, svg); }
  for (let j = 0; j <= ny; j++){ const v = ymin + j * ystep; el("line", {x1:X(xmin), x2:X(xmax), y1:Y(v), y2:Y(v), stroke:"#DCE4F0"}, svg); }
  const ax = xmin <= 0 && 0 <= xmax ? X(0) : X(xmin), ay = ymin <= 0 && 0 <= ymax ? Y(0) : Y(ymin);
  el("line", {x1:X(xmin), x2:X(xmax), y1:ay, y2:ay, stroke:"#172033", "stroke-width":1.6}, svg);
  el("line", {x1:ax, x2:ax, y1:Y(ymin), y2:Y(ymax), stroke:"#172033", "stroke-width":1.6}, svg);
  txt(svg, X(xmax) + 14, ay + 5, cfg.xlabel || "x", {fill:"#172033"}); txt(svg, ax, Y(ymax) - 12, cfg.ylabel || "y", {fill:"#172033"});
  const ex = Math.max(1, Math.ceil(nx / 10)), ey = Math.max(1, Math.ceil(ny / 10));
  for (let i = 0; i <= nx; i += ex){ const v = xmin + i * xstep; if (Math.abs(v) > 1e-9) txt(svg, X(v), ay + 18, cfg.xpi ? fmtPi(v) : fmt(v), {"font-size":12}); }
  for (let j = 0; j <= ny; j += ey){ const v = ymin + j * ystep; if (Math.abs(v) > 1e-9) txt(svg, ax - 10, Y(v) + 4, fmt(v), {"font-size":12, "text-anchor":"end"}); }
  if (xmin <= 0 && ymin <= 0) txt(svg, ax - 10, ay + 18, "O", {"font-size":12, "text-anchor":"end"});
  drawCurves(svg, cfg, X, Y, pad, S);
  if (!interactive){
    (cfg.points || []).forEach(pt => { el("circle", {cx:X(pt[0]), cy:Y(pt[1]), r:5, fill:"#FFD84D", stroke:"#172033", "stroke-width":1.5}, svg);
      if (pt[2]) txt(svg, X(pt[0]) + 8, Y(pt[1]) - 8, pt[2], {"text-anchor":"start", fill:"#172033", "font-size":13}); });
    return svg;
  }
  const guide = el("path", {stroke:"#1D3FA8", "stroke-dasharray":"4 4", fill:"none", visibility:"hidden"}, svg);
  const dot = el("circle", {r:8, fill:"#1D3FA8", stroke:"#fff", "stroke-width":3, visibility:"hidden"}, svg);
  let cur = null;
  const snap = (v, lo, hi, st) => Math.round(Math.min(hi, Math.max(lo, Math.round((v - lo) / st) * st + lo)) * 1e6) / 1e6;
  const set = (x, y) => { x = snap(x, xmin, xmax, xstep); y = snap(y, ymin, ymax, ystep); cur = [x, y];
    dot.setAttribute("cx", X(x)); dot.setAttribute("cy", Y(y)); dot.setAttribute("visibility", "visible");
    guide.setAttribute("d", `M${X(x)} ${ay} V${Y(y)} H${ax}`); guide.setAttribute("visibility", "visible");
    onChange(cur, `(${fmt(x)}, ${fmt(y)})`); };
  svg.addEventListener("pointerdown", e => { const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * S, py = (e.clientY - r.top) / r.height * S;
    set(xmin + (px - pad) / (S - 2 * pad) * (xmax - xmin), ymin + (S - pad - py) / (S - 2 * pad) * (ymax - ymin)); });
  svg.addEventListener("keydown", e => { const d = {ArrowRight:[1,0], ArrowLeft:[-1,0], ArrowUp:[0,1], ArrowDown:[0,-1]}[e.key]; if (!d) return;
    e.preventDefault(); const c = cur || [(xmin + xmax) / 2, (ymin + ymax) / 2]; set(c[0] + d[0] * xstep, c[1] + d[1] * ystep); });
  svg.lock = () => { svg.style.pointerEvents = "none"; };
  return svg;
}

function geoFig(cfg){
  const E = cfg.elements || [], W = 420, pad = 34;
  const xs = [], ys = [];
  const add = q => { xs.push(q[0]); ys.push(q[1]); };
  E.forEach(e => { ["p", "a", "b", "c"].forEach(k => e[k] && Array.isArray(e[k]) && add(e[k])); (e.pts || []).forEach(add);
    if (e.t === "circle"){ add([e.c[0] - e.r, e.c[1] - e.r]); add([e.c[0] + e.r, e.c[1] + e.r]); } });
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sc = Math.min((W - 2 * pad) / Math.max(x1 - x0, 1e-6), (cfg.maxh || 300) / Math.max(y1 - y0, 1e-6));
  const H = (y1 - y0) * sc + 2 * pad, Wd = (x1 - x0) * sc + 2 * pad;
  const X = x => pad + (x - x0) * sc, Y = y => H - pad - (y - y0) * sc;
  const cx = xs.reduce((a, b) => a + b, 0) / xs.length, cy = ys.reduce((a, b) => a + b, 0) / ys.length;
  const svg = el("svg", {viewBox:`0 0 ${Wd} ${H}`, width:Wd, role:"img", "aria-label": cfg.alt || "도형 그림"});
  const ink = "#172033", hl = "#1D3FA8", soft = "#7C889E";
  const order = {poly:0, circle:1, seg:2, arc:3, right:3, text:4, pt:5};
  [...E].sort((p, q) => (order[p.t] ?? 2) - (order[q.t] ?? 2)).forEach(e => {
    const col = e.hl ? hl : ink;
    if (e.t === "poly") el("polygon", {points: e.pts.map(q => X(q[0]) + "," + Y(q[1])).join(" "), fill: e.fill === false ? "none" : (e.hl ? "#DCE4F8" : "#EEF2FA"), stroke: col, "stroke-width": 1.8, "stroke-dasharray": e.dash ? "5 4" : "none", "fill-opacity": e.fill === false ? 0 : 0.9}, svg);
    else if (e.t === "seg") el("line", {x1:X(e.a[0]), y1:Y(e.a[1]), x2:X(e.b[0]), y2:Y(e.b[1]), stroke: e.dash ? soft : col, "stroke-width": e.hl ? 2.6 : 1.8, "stroke-dasharray": e.dash ? "5 4" : "none"}, svg);
    else if (e.t === "circle") el("circle", {cx:X(e.c[0]), cy:Y(e.c[1]), r:e.r * sc, fill:"none", stroke:col, "stroke-width":1.8, "stroke-dasharray": e.dash ? "5 4" : "none"}, svg);
    else if (e.t === "right"){ const v = e.p, u1 = [e.a[0] - v[0], e.a[1] - v[1]], u2 = [e.b[0] - v[0], e.b[1] - v[1]];
      const n1 = Math.hypot(...u1), n2 = Math.hypot(...u2), s = 11 / sc;
      const pA = [v[0] + u1[0] / n1 * s, v[1] + u1[1] / n1 * s], pB = [v[0] + u2[0] / n2 * s, v[1] + u2[1] / n2 * s], pC = [pA[0] + u2[0] / n2 * s, pA[1] + u2[1] / n2 * s];
      el("path", {d:`M${X(pA[0])} ${Y(pA[1])} L${X(pC[0])} ${Y(pC[1])} L${X(pB[0])} ${Y(pB[1])}`, fill:"none", stroke:ink, "stroke-width":1.4}, svg); }
    else if (e.t === "arc"){ const v = e.p, a1 = Math.atan2(e.a[1] - v[1], e.a[0] - v[0]), a2 = Math.atan2(e.b[1] - v[1], e.b[0] - v[0]);
      let d = a2 - a1; while (d <= -Math.PI) d += 2 * Math.PI; while (d > Math.PI) d -= 2 * Math.PI;
      const R = (e.r || 22) / sc, N = 24; let path = "";
      for (let i = 0; i <= N; i++){ const t = a1 + d * i / N; path += (i ? " L" : "M") + X(v[0] + R * Math.cos(t)).toFixed(1) + " " + Y(v[1] + R * Math.sin(t)).toFixed(1); }
      el("path", {d:path, fill:"none", stroke:hl, "stroke-width":1.8}, svg);
      if (e.label){ const tm = a1 + d / 2, R2 = R + 14 / sc; txt(svg, X(v[0] + R2 * Math.cos(tm)), Y(v[1] + R2 * Math.sin(tm)) + 5, e.label, {fill:hl, "font-size":14}); } }
    else if (e.t === "text") txt(svg, X(e.p[0]), Y(e.p[1]) + 5, e.s, {fill: e.hl ? hl : "#4A5670", "font-size": 14});
    else if (e.t === "pt"){ if (!e.hide) el("circle", {cx:X(e.p[0]), cy:Y(e.p[1]), r:3.2, fill:ink}, svg);
      if (e.label){ let dx = e.p[0] - cx, dy = e.p[1] - cy; const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
        if (e.pos){ const m = {n:[0,1], s:[0,-1], e:[1,0], w:[-1,0], ne:[.7,.7], nw:[-.7,.7], se:[.7,-.7], sw:[-.7,-.7]}[e.pos]; dx = m[0]; dy = m[1]; }
        txt(svg, X(e.p[0]) + dx * 14, Y(e.p[1]) - dy * 14 + 5, e.label, {fill:ink, "font-size":15, "font-weight":500}); } }
  });
  return svg;
}

/* ---------- 문항 ---------- */
function buildQuestion(q, host){
  const api = {ready:false, value:null, check:null, lock(){}, reveal(){}};

  const prompt = document.createElement("p"); prompt.className = "prompt";
  if (q.qtype === "fill_blank"){
    const inputs = [];
    q.prompt.split(/(\{\{\d+\}\})/).forEach(part => {
      const m = part.match(/^\{\{(\d+)\}\}$/);
      if (m){ const i = document.createElement("input"); i.className = "blank"; i.setAttribute("aria-label", `빈칸 ${m[1]}`);
        i.autocomplete = "off"; i.addEventListener("input", () => { api.ready = inputs.every(x => x.value.trim()); api.onChange(); });
        inputs.push(i); prompt.appendChild(i); }
      else prompt.appendChild(document.createTextNode(part));
    });
    host.appendChild(prompt);
    const PALETTE = ["₂", "₃", "₄", "²", "³", "⁺", "⁻", "→", "−"];
    const needs = q.blanks.some(bl => bl.answers.every(ans => [...ans].some(ch => PALETTE.includes(ch) && ch !== "−")));
    let last = inputs[0];
    inputs.forEach(i => i.addEventListener("focus", () => { last = i; }));
    if (needs){
      const bar = document.createElement("div"); bar.className = "symbols"; bar.setAttribute("aria-label", "기호 입력");
      PALETTE.forEach(sym => { const bt = document.createElement("button"); bt.type = "button"; bt.textContent = sym; bt.setAttribute("aria-label", `기호 ${sym} 넣기`);
        bt.addEventListener("pointerdown", e => e.preventDefault());
        bt.addEventListener("click", () => { if (last.readOnly) return; const st = last.selectionStart ?? last.value.length, en = last.selectionEnd ?? st;
          last.value = last.value.slice(0, st) + sym + last.value.slice(en); last.focus(); last.setSelectionRange(st + sym.length, st + sym.length);
          last.dispatchEvent(new Event("input")); });
        bar.appendChild(bt); });
      host.appendChild(bar);
    }
    api.focus = () => inputs[0].focus();
    api.check = () => {
      const got = inputs.map(i => norm(i.value)), ok = q.blanks.map(b => b.answers.map(norm));
      const groups = q.unordered_groups || [];
      const inGroup = new Set(groups.flat().map(n => n - 1));
      for (let k = 0; k < ok.length; k++) if (!inGroup.has(k) && !ok[k].includes(got[k])) return false;
      for (const g of groups){ const idx = g.map(n => n - 1), pool = idx.map(k => ok[k]); const used = new Set();
        for (const k of idx){ const hit = pool.findIndex((a, j) => !used.has(j) && a.includes(got[k])); if (hit < 0) return false; used.add(hit); } }
      return true;
    };
    api.lock = () => inputs.forEach(i => i.readOnly = true);
    api.reveal = () => inputs.forEach((i, k) => i.value = q.blanks[k].answers[0]);
    api.enter = inputs;
    return api;
  }
  prompt.textContent = q.prompt; host.appendChild(prompt);
  if (q.qtype === "numeric"){
    const i = document.createElement("input"); i.className = "ans"; i.inputMode = q.answer_format === "integer" ? "numeric" : "text";
    i.autocomplete = "off"; i.placeholder = q.answer_format === "fraction" ? "예: -3/4" : q.answer_format === "decimal" ? "예: 0.5" : "답";
    i.setAttribute("aria-label", "답 입력");
    i.addEventListener("input", () => { api.ready = !!i.value.trim(); api.onChange(); });
    host.appendChild(i); api.focus = () => i.focus(); api.enter = [i];
    api.check = () => { const u = frac(i.value), a = frac(q.answer); if (!u || !a) return false;
      if (q.answer_format === "decimal" || q.tolerance) return Math.abs(fracVal(u) - fracVal(a)) <= (q.tolerance || 0) + 1e-9;
      return fracEq(u, a); };
    api.lock = () => i.readOnly = true;
    api.reveal = () => i.value = q.answer.replace(/^-/, "−");
    return api;
  }
  if (q.qtype === "ordering"){
    const ol = document.createElement("ol"); ol.className = "order"; host.appendChild(ol);
    let order = q.items.map(it => it.id); api.ready = true;
    const byId = Object.fromEntries(q.items.map(it => [it.id, it.text]));
    let locked = false;
    const draw = () => { ol.innerHTML = "";
      order.forEach((id, k) => { const li = document.createElement("li");
        li.innerHTML = `<span class="n">${k + 1}</span><span class="t"></span>`; li.querySelector(".t").textContent = byId[id];
        const up = document.createElement("button"), dn = document.createElement("button");
        up.textContent = "↑"; dn.textContent = "↓"; up.setAttribute("aria-label", `${byId[id]} 위로`); dn.setAttribute("aria-label", `${byId[id]} 아래로`);
        up.disabled = locked || k === 0; dn.disabled = locked || k === order.length - 1;
        up.onclick = () => { [order[k - 1], order[k]] = [order[k], order[k - 1]]; draw(); ol.querySelectorAll("button")[(k - 1) * 2].focus(); };
        dn.onclick = () => { [order[k + 1], order[k]] = [order[k], order[k + 1]]; draw(); ol.querySelectorAll("button")[(k + 1) * 2 + 1].focus(); };
        li.append(up, dn); ol.appendChild(li); }); };
    draw();
    api.check = () => order.join() === q.answer_order.join();
    api.lock = () => { locked = true; draw(); };
    api.reveal = () => { order = [...q.answer_order]; draw(); };
    return api;
  }
  if (q.qtype === "diagram"){
    const box = document.createElement("div"); box.className = "figure"; host.appendChild(box);
    const read = document.createElement("div"); read.className = "readout"; read.textContent = "점을 찍어 보세요";
    let svg;
    if (q.widget === "number_line"){
      svg = numberLine(q.config, true, (v, s) => { api.value = v; api.ready = true; read.textContent = `선택: ${s}`; api.onChange(); });
      api.check = () => Math.abs(api.value - q.answer.value) <= (q.answer.tolerance || 0) + 1e-9;
      api.reveal = () => { read.textContent = `정답: ${fmt(q.answer.value)}`; };
    } else {
      svg = coordPlane(q.config, (v, s) => { api.value = v; api.ready = true; read.textContent = `선택: ${s}`; api.onChange(); });
      api.check = () => { const t = (q.answer.tolerance || 0) + 1e-9; return Math.abs(api.value[0] - q.answer.x) <= t && Math.abs(api.value[1] - q.answer.y) <= t; };
      api.reveal = () => { read.textContent = `정답: (${fmt(q.answer.x)}, ${fmt(q.answer.y)})`; };
    }
    box.append(svg, read); api.focus = () => svg.focus(); api.lock = () => svg.lock();
    return api;
  }
  if (q.qtype === "written"){
    const t = document.createElement("textarea"); t.setAttribute("aria-label", "설명 쓰기"); t.placeholder = "자기 말로 설명해 보세요";
    t.addEventListener("input", () => { api.ready = t.value.trim().length >= 10; api.onChange(); });
    host.appendChild(t); api.focus = () => t.focus();
    api.check = () => { const v = norm(t.value); const r = q.rubric;
      const hit = r.keyword_groups.filter(g => g.some(k => v.includes(norm(k)))).length; return hit >= r.min_groups_matched; };
    api.lock = () => t.readOnly = true; api.reveal = () => {};
    api.written = true;
    return api;
  }
  host.appendChild(document.createTextNode("지원하지 않는 문항 형식입니다."));
  api.ready = true; api.check = () => true; return api;
}


const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function answerText(q){
  if (q.qtype === "numeric") return q.answer.replace(/^-/, "−");
  if (q.qtype === "fill_blank") return q.prompt.replace(/\{\{(\d+)\}\}/g, (m, n) => q.blanks[n - 1].answers[0]);
  if (q.qtype === "ordering"){ const t = Object.fromEntries(q.items.map(it => [it.id, it.text])); return q.answer_order.map(id => t[id]).join("  →  "); }
  if (q.qtype === "diagram") return q.widget === "number_line" ? fmt(q.answer.value) : `(${fmt(q.answer.x)}, ${fmt(q.answer.y)})`;
  return "";
}
function solHtml(text){
  const lines = String(text || "").split("\n").map(t => t.trim()).filter(Boolean);
  if (!lines.length) return "";
  return '<div class="solution"><b>풀이</b>' + (lines.length > 1 ? "<ol>" + lines.map(l => "<li>" + esc(l) + "</li>").join("") + "</ol>" : "<br>" + esc(lines[0])) + "</div>";
}


/* ---------- 진단 ---------- */
const KEY = "sci-arena:placement";
const main = $("#main"), fb = $("#fb"), fbText = $("#fbText"), mainBtn = $("#mainBtn"), skipBtn = $("#skipBtn");
let POOL, byId = {}, S = null, TR = {};
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const num = cid => +cid.slice(1);

const LEVELS = [
  {v:"base", t:"중학 과학이 아직 자신 없어요", d:"기초 과학(코스 0)부터 확인한 뒤 고른 과목으로 넘어갑니다."},
  {v:"one", t:"중학 과학은 마쳤어요", d:"고른 과목의 Ⅰ 코스부터 확인합니다. 많이 틀리면 기초 과학도 확인합니다."},
  {v:"two", t:"Ⅰ 과목까지 공부했어요", d:"Ⅰ 코스를 통과하면 이어서 같은 과목의 Ⅱ 코스까지 확인합니다."}
];

function progressTo(p){ $("#barFill").style.width = p + "%"; document.querySelector(".bar").setAttribute("aria-valuenow", Math.round(p)); }

function intro(){
  fb.hidden = true; progressTo(0); $("#where").textContent = "진입 진단";
  const saved = loadSaved();
  main.innerHTML = `<p class="stage">진입 진단</p>
    <h1>어디서부터 시작하면 좋을지 찾아 봅니다</h1>
    <p class="lede">챕터마다 한 문제씩 풀면, 이미 아는 내용은 건너뛰고 과목마다 필요한 곳부터 시작할 수 있게 추천해 드립니다.</p>
    <ul class="facts">
      <li>코스 하나에 6~8문항입니다. 네 과목을 모두 고르면 보통 25~40분 걸립니다.</li>
      <li>푸는 동안에는 정답을 알려 주지 않습니다. 틀린 문제의 풀이는 끝에 모아서 보여 드립니다.</li>
      <li>모르는 문제는 찍지 말고 <b>모르겠어요</b>를 눌러 주세요. 그래야 추천이 정확해집니다.</li>
      <li>계산 문제에 필요한 상수는 문제에 적혀 있습니다. 종이와 연필이 있으면 편합니다.</li>
    </ul>
    <fieldset><legend>지금까지 어디까지 공부했나요?</legend>
      ${LEVELS.map((o, k) => `<label class="choice"><input type="radio" name="lv" value="${o.v}"${k === 1 ? " checked" : ""}>
        <div><b>${esc(o.t)}</b><span>${esc(o.d)}</span></div></label>`).join("")}
    </fieldset>
    <fieldset style="margin-top:18px"><legend>진단할 과목을 고르세요</legend>
      <div class="subj">${POOL.tracks.map(t => `<label class="choice"><input type="checkbox" name="subj" value="${t.id}" checked>
        <div><b>${esc(t.name)}</b><span>${esc(byId[t.a].title)} · ${esc(byId[t.b].title)}</span></div></label>`).join("")}</div>
      <p class="err" id="err" hidden>과목을 하나 이상 고르세요.</p>
    </fieldset>
    <div class="cta-row" style="margin-top:18px"><button class="btn" id="go">진단 시작</button>
      ${saved ? `<a class="btn ghost" href="#" id="last">지난 결과 보기</a>` : ""}</div>`;
  $("#go").onclick = () => {
    const subjects = [...document.querySelectorAll("input[name=subj]:checked")].map(x => x.value);
    if (!subjects.length){ $("#err").hidden = false; return; }
    begin(document.querySelector("input[name=lv]:checked").value, subjects);
  };
  if (saved) $("#last").onclick = e => { e.preventDefault(); S = saved.state; result(); };
}

function begin(level, subjects){
  const firsts = POOL.tracks.filter(t => subjects.includes(t.id)).map(t => t.a);
  S = {level, subjects, queue: level === "base" ? [POOL.base, ...firsts] : firsts, tested:{}, answers:[], at:Date.now()};
  runCourse(S.queue.shift());
}

/* 한 코스 블록: 챕터마다 한 문항 */
let block = null;
function runCourse(cid){
  const c = byId[cid];
  const need = Math.ceil(c.chapters.length * POOL.pass_rate - 1e-9);
  block = {cid, need, allowWrong:c.chapters.length - need, i:0, right:0, wrong:0,
           qs:c.chapters.map(ch => ({ch, q:pick(ch.questions.slice(0, Math.min(POOL.pick_from, ch.questions.length)))}))};
  S.tested[cid] = {status:"running", right:0, wrong:0, asked:0, chapters:{}};
  askNext();
}

let api = null;
function askNext(){
  const b = block, c = byId[b.cid];
  if (b.i >= b.qs.length) return endCourse();
  const {ch, q} = b.qs[b.i];
  const done = S.answers.length, est = done + (b.qs.length - b.i) + S.queue.length * 7 + 1;
  progressTo(Math.min(95, done / est * 100));
  $("#where").textContent = `진단 · ${c.title}`;
  main.innerHTML = `<span class="course-tag">${esc(c.title)} · ${b.i + 1} / ${b.qs.length}</span>`;
  window.scrollTo(0, 0);
  const host = document.createElement("div"); main.appendChild(host);
  api = buildQuestion(q, host);
  if (q.figure){ const pr = host.querySelector(".prompt"); if (pr) pr.after(figure(q.figure)); }
  fb.hidden = false; fbText.innerHTML = ""; skipBtn.hidden = false;
  mainBtn.textContent = "다음"; mainBtn.disabled = !api.ready;
  api.onChange = () => { mainBtn.disabled = !api.ready; };
  (api.enter || []).forEach(inp => inp.addEventListener("keydown", e => { if (e.key === "Enter" && !mainBtn.disabled){ e.preventDefault(); mainBtn.click(); } }));
  { const a = api; if (a.focus && matchMedia("(pointer:fine)").matches) setTimeout(() => { if (api === a) a.focus(); }, 50); }
}

function record(correct, skipped){
  const b = block, {ch, q} = b.qs[b.i];
  S.answers.push({c:b.cid, ch:ch.dir, chTitle:ch.title, qid:q.id, correct, skipped, q});
  const t = S.tested[b.cid]; t.asked++; t.chapters[ch.dir] = correct ? "ok" : "miss";
  if (correct){ b.right++; t.right++; } else { b.wrong++; t.wrong++; }
  b.i++;
  if (b.wrong > b.allowWrong) return endCourse();   // 탈락이 확정되면 바로 멈춤
  askNext();
}
mainBtn.addEventListener("click", () => { if (!api || !api.ready) return; api.lock(); record(!!api.check(), false); });
skipBtn.addEventListener("click", () => { if (api) api.lock(); record(false, true); });

function endCourse(){
  const b = block, t = S.tested[b.cid], cid = b.cid;
  t.status = b.right >= b.need ? "pass" : "fail";
  t.severe = t.status === "fail" && b.right < b.wrong;
  block = null;
  if (cid === POOL.base){
    if (t.status === "fail") S.queue = S.queue.filter(x => x === POOL.base);   // 기초부터: Ⅰ 진단은 뒤로 미룸
  } else {
    const tr = TR[cid];
    if (tr && tr.a === cid){
      if (t.status === "pass" && S.level === "two" && !S.tested[tr.b] && !S.queue.includes(tr.b)) S.queue.unshift(tr.b);
      if (t.severe && !S.tested[POOL.base] && !S.queue.includes(POOL.base)) S.queue.unshift(POOL.base);
    }
  }
  const nx = S.queue.shift();
  if (nx) return runCourse(nx);
  result();
}

/* 판정 */
function firstMiss(cid){
  const t = S.tested[cid], ch = byId[cid].chapters.find(ch => t.chapters[ch.dir] === "miss") || byId[cid].chapters[0];
  return {c:cid, ch:ch.dir, chTitle:ch.title, chNo:ch.no};
}
function placement(){
  const status = {}, base = POOL.base, tb = S.tested[base];
  const aSevere = POOL.tracks.some(tr => S.tested[tr.a] && S.tested[tr.a].severe);
  status[base] = tb ? (tb.status === "pass" ? "pass" : "start") : (aSevere ? "untested" : "assumed");
  const baseStart = status[base] === "start";
  POOL.tracks.forEach(tr => {
    const ta = S.tested[tr.a], tb2 = S.tested[tr.b];
    if (ta) status[tr.a] = ta.status === "pass" ? "pass" : (baseStart ? "later" : "start");
    else status[tr.a] = baseStart && S.subjects.includes(tr.id) ? "later" : "untested";
    if (tb2) status[tr.b] = tb2.status === "pass" ? "pass" : (status[tr.a] === "pass" ? "start" : "later");
    else status[tr.b] = status[tr.a] === "pass" ? "untested" : (status[tr.a] === "untested" ? "untested" : "later");
  });
  const starts = {};
  Object.keys(status).forEach(cid => { if (status[cid] === "start") starts[cid] = firstMiss(cid); });
  let start = starts[base] || null;
  if (!start){ const a = POOL.tracks.find(tr => starts[tr.a]); if (a) start = starts[a.a]; }
  if (!start){ const b = POOL.tracks.find(tr => starts[tr.b]); if (b) start = starts[b.b]; }
  const weak = S.answers.filter(a => !a.correct && (status[a.c] === "pass" || status[a.c] === "assumed"));
  const chapters = {};
  S.answers.forEach(a => { const st = status[a.c]; chapters[`${a.c}-${a.ch}`] = a.correct ? "ok" : (st === "pass" || st === "assumed" ? "weak" : "miss"); });
  Object.values(starts).forEach(s => { chapters[`${s.c}-${s.ch}`] = "start"; });
  return {status, start, starts, weak, chapters};
}

function save(pl){
  try{ localStorage.setItem(KEY, JSON.stringify({version:2, at:Date.now(), start:pl.start, starts:pl.starts, status:pl.status, chapters:pl.chapters, state:S})); }catch(e){}
}
function loadSaved(){ try{ const v = JSON.parse(localStorage.getItem(KEY)); return v && v.state ? v : null; }catch(e){ return null; } }

const LABEL = {pass:"진단 통과", assumed:"건너뛰어도 됨", start:"여기서 시작", later:"이후 과정", fail:"보충 필요", untested:"진단 안 함"};
const startLink = s => `player.html?c=${s.c}&ch=${s.ch.slice(2)}&l=01`;

function result(){
  fb.hidden = true; progressTo(100); $("#where").textContent = "진단 결과";
  const pl = placement(); save(pl);
  let hero;
  if (pl.start){
    const c = byId[pl.start.c];
    const others = Object.values(pl.starts).filter(s => s.c !== pl.start.c);
    hero = `<div class="result-hero"><p class="kicker">가장 먼저 시작할 곳</p>
      <h1>코스 ${num(pl.start.c)} ${esc(c.title)}<br>챕터 ${pl.start.chNo} ${esc(pl.start.chTitle)}</h1>
      <p>${pl.start.chNo > 1 ? `앞의 챕터 ${pl.start.chNo - 1}개는 진단을 통과했습니다. ` : ""}${pl.start.c === POOL.base ? "기초 과학을 먼저 채운 뒤 과목별 Ⅰ 코스로 넘어가세요." : ""}${others.length ? ` 다른 과목의 시작 위치는 아래 과목별 결과에 있습니다.` : ""}</p>
      <div class="cta-row"><a class="btn" href="${startLink(pl.start)}">여기서 시작하기</a>
        <a class="btn ghost" href="browse.html?c=${pl.start.c}">코스 둘러보기</a></div></div>`;
  } else {
    hero = `<div class="result-hero"><p class="kicker">진단 결과</p><h1>진단한 코스를 모두 통과했습니다</h1>
      <p>아래 과목별 결과에서 아직 진단하지 않은 코스를 이어서 확인할 수 있습니다. 통과한 코스 안에서 틀린 챕터는 챕터 복습으로 채우세요.</p></div>`;
  }
  const chipRow = (cid, extra) => { const c = byId[cid], st = pl.status[cid], t = S.tested[cid];
    const sub = t ? `${t.right} / ${t.asked}문항 정답` : (st === "assumed" ? "과목 코스 결과로 보아 진단을 생략했습니다" : "");
    return `<div class="row"><div>코스 ${num(cid)} ${esc(c.title)}${sub ? `<span class="sub">${sub}</span>` : ""}</div><span class="chip ${st}">${LABEL[st]}</span></div>`; };
  const base = `<div class="track"><h3>기초</h3>${chipRow(POOL.base)}
    ${pl.status[POOL.base] === "untested" ? `<div class="acts"><button class="btn ghost" data-run="${POOL.base}">기초 과학 진단하기</button></div>` : ""}
    ${pl.starts[POOL.base] ? `<div class="acts"><a class="btn" href="${startLink(pl.starts[POOL.base])}">챕터 ${pl.starts[POOL.base].chNo}부터 시작</a></div>` : ""}</div>`;
  const tracks = POOL.tracks.map(tr => {
    const acts = [];
    [tr.a, tr.b].forEach(cid => { if (pl.starts[cid]) acts.push(`<a class="btn" href="${startLink(pl.starts[cid])}">${esc(byId[cid].title)} 챕터 ${pl.starts[cid].chNo}부터 시작</a>`); });
    if (pl.status[tr.a] === "untested") acts.push(`<button class="btn ghost" data-run="${tr.a}">${esc(byId[tr.a].title)} 진단하기</button>`);
    if (pl.status[tr.a] === "pass" && pl.status[tr.b] === "untested")
      acts.push(`<button class="btn ghost" data-run="${tr.b}">${esc(byId[tr.b].title)} 진단하기</button>`,
                `<a class="btn link" href="player.html?c=${tr.b}&ch=01&l=01">${esc(byId[tr.b].title)} 처음부터</a>`);
    return `<div class="track"><h3>${esc(tr.name)}</h3>${chipRow(tr.a)}${chipRow(tr.b)}${acts.length ? `<div class="acts">${acts.join("")}</div>` : ""}</div>`;
  }).join("");
  const weak = pl.weak.length ? `<h2 class="sec">복습하면 좋은 챕터</h2>
    <p class="note">통과한 코스 안에서 틀린 챕터입니다. 챕터 복습(10문항)으로 빈 곳을 채우세요.</p>
    <ul class="clist weak">${pl.weak.map(a => `<li><div>코스 ${num(a.c)} ${esc(byId[a.c].title)} · 챕터 ${+a.ch.slice(2)} ${esc(a.chTitle)}</div><a href="player.html?c=${a.c}&ch=${a.ch.slice(2)}&review=1">챕터 복습</a></li>`).join("")}</ul>` : "";
  const misses = S.answers.filter(a => !a.correct);
  const missHtml = misses.length ? `<h2 class="sec">틀린 문항 다시 보기</h2>${misses.map(a => `<details class="miss">
      <summary>${esc(byId[a.c].title)} · ${esc(a.chTitle)} ${a.skipped ? "<small>(모르겠어요)</small>" : ""}</summary>
      <div class="inner"><p>${esc(a.q.prompt.replace(/\{\{\d+\}\}/g, "□"))}</p><p class="answerline">정답: ${esc(answerText(a.q))}</p>${a.q.explanation ? solHtml(a.q.explanation) : ""}</div></details>`).join("")}` : "";
  main.innerHTML = hero + `<h2 class="sec">과목별 결과</h2>` + base + tracks + weak + missHtml +
    `<div class="cta-row" style="margin-top:28px"><button class="btn ghost" id="again">처음부터 다시 진단</button><a class="btn link" href="index.html">첫 화면</a></div>`;
  main.querySelectorAll("[data-run]").forEach(b => b.onclick = () => { S.queue = []; runCourse(b.dataset.run); });
  $("#again").onclick = () => { S = null; intro(); };
  window.scrollTo(0, 0);
}

$("#close").addEventListener("click", () => {
  if (block && !confirm("진단을 그만둘까요? 지금까지 푼 내용은 저장되지 않습니다.")) return;
  location.href = "index.html";
});

(async () => {
  try{
    const r = await fetch("content/level1/placement.json"); if (!r.ok) throw new Error("content/level1/placement.json");
    POOL = await r.json(); POOL.courses.forEach(c => byId[c.id] = c);
    POOL.tracks.forEach(t => { TR[t.a] = t; TR[t.b] = t; });
    intro();
  }catch(e){ main.innerHTML = `<div class="error">진단 문항을 불러오지 못했습니다. <code>${esc(e.message)}</code></div>`; }
})();
</script>
